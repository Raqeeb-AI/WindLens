version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windlens-backend
    ports:
      - "8000:8000"
    environment:
      - WINDLENS_DATA_DIR=/app/data/processed
    volumes:
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped
